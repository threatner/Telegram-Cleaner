[project]
name = "tgcleaner"
version = "0.1.0"
description = "Bulk leave Telegram channels/groups and delete DMs through a TUI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Telegram Cleaner contributors" }]
keywords = ["telegram", "cli", "tui", "cleanup", "telethon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "telethon>=1.36",
    "qrcode>=7.4",
    "questionary>=2.0",
    "rich>=13.0",
    "textual>=0.50",
]

[project.urls]
Homepage = "https://github.com/threatner/Telegram-Cleaner"
Issues   = "https://github.com/threatner/Telegram-Cleaner/issues"

[project.scripts]
tgcleaner = "tgcleaner.cli:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tgcleaner*"]
